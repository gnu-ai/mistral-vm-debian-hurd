# GRUB early configuration for headless GNU/Hurd boot in QEMU.
#
# Built into a standalone El Torito GRUB image by hurv_vm.py: the
# serial console is enabled, the Debian GNU/Hurd preinstalled disk
# image is booted with console=com0 so that the kernel, the boot
# script AND the getty all use the serial line - a fully scriptable,
# headless machine.
#
# @KERNEL@, @ROOTPART@ and @UUID@ are substituted by hurv_vm.py; the
# rest mirrors the image's own /boot/grub/grub.cfg entry.
echo "=== mistral-vm-debian-hurd: booting GNU/Hurd (console=com0) ==="
serial --unit=0
terminal_input --append serial
terminal_output --append serial
set root=(hd0,msdos@ROOTPART@)
search --no-floppy --fs-uuid --set=root @UUID@
echo            'Loading GNU Mach ...'
multiboot       @KERNEL@ root=part:@ROOTPART@:device:wd0 console=com0
echo            'Loading the Hurd ...'
module          /hurd/pci-arbiter.static pci-arbiter \
                --host-priv-port='${host-port}' --device-master-port='${device-port}' \
                --next-task='${acpi-task}' \
                '$(pci-task=task-create)' '$(task-resume)'
module          /hurd/acpi.static acpi \
                --next-task='${disk-task}' \
                '$(acpi-task=task-create)'
module          /hurd/rumpdisk.static rumpdisk \
                --next-task='${fs-task}' \
                '$(disk-task=task-create)'
module          /hurd/ext2fs.static ext2fs \
                --multiboot-command-line='${kernel-command-line}' \
                --exec-server-task='${exec-task}' -T typed '${root}' \
                '$(fs-task=task-create)'
module          /lib/ld-x86-64.so.1 exec /hurd/exec '$(exec-task=task-create)'
boot
